<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A&S Store - Printing Services</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: linear-gradient(to bottom right, #ffffff, #f3f4f6);
      color: #111;
    }

    header {
      display: flex;
      justify-content: space-between;
      padding: 20px;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
    }

    h1 { margin: 0; }

    .hero {
      text-align: center;
      padding: 60px 20px;
    }

    .btn {
      padding: 12px 18px;
      border: none;
      cursor: pointer;
      margin: 5px;
      border-radius: 8px;
    }

    .primary { background: black; color: white; }
    .outline { border: 1px solid #333; background: transparent; }
    .green { background: #16a34a; color: white; }

    .section {
      padding: 20px;
      text-align: center;
    }

    .card {
      background: white;
      padding: 15px;
      margin: 10px;
      border-radius: 10px;
      display: inline-block;
      width: 250px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    input[type=file] {
      display: none;
    }

    .upload-label {
      display: inline-block;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      color: green;
    }

    .qr {
      width: 180px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>A&S Store</h1>
  <button class="btn outline">Contact</button>
</header>

<div class="hero">
  <h2>Fast & Affordable Printing Services</h2>
  <p>Xerox • ID Pictures • Stickers • Rush Printing</p>

  <button class="btn primary" onclick="openMessenger()">Message Us</button>

  <label class="upload-label">
    <input type="file" id="fileInput" onchange="handleFile(event)" />
    <button class="btn outline">Upload File</button>
  </label>
</div>

<div class="section" id="result" style="display:none;">
  <h3>Smart Estimate</h3>
  <p id="fileName"></p>
  <p id="pages"></p>
  <p class="price" id="price"></p>

  <button class="btn green" onclick="sendMessenger()">Send to Store</button>
  <button class="btn outline" onclick="downloadReceipt()">Download Receipt</button>
</div>

<div class="section">
  <h3>Payment</h3>
  <p>GCash: 09XX-XXX-XXXX</p>
  <img src="gcash_qr.png" class="qr" alt="GCash QR" />
  <p>Scan QR or send payment to confirm order</p>
</div>

<script>
let selectedFile = null;
let pages = 1;
let price = 0;

const bwRate = 5;
const colorRate = 12;

function openMessenger() {
  window.open("https://m.me/ASStoreOfficial", "_blank");
}

async function handleFile(event) {
  const file = event.target.files[0];
  if (!file) return;

  selectedFile = file;

  const fileName = file.name.toLowerCase();

  if (!fileName.endsWith(".pdf")) {
    pages = 1;
    price = bwRate;
    showResult(file.name);
    return;
  }

  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

  pages = pdf.numPages;
  price = pages * bwRate;

  showResult(file.name);
}

function showResult(name) {
  document.getElementById("result").style.display = "block";
  document.getElementById("fileName").innerText = "File: " + name;
  document.getElementById("pages").innerText = "Pages: " + pages;
  document.getElementById("price").innerText = "₱" + price;
}

function sendMessenger() {
  const msg = encodeURIComponent(
    `Hello A&S Store\nFile: ${selectedFile.name}\nPages: ${pages}\nPrice: ₱${price}`
  );
  window.open("https://m.me/ASStoreOfficial?text=" + msg, "_blank");
}

function downloadReceipt() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.text("A&S Store Receipt", 20, 20);
  doc.text("File: " + selectedFile.name, 20, 40);
  doc.text("Pages: " + pages, 20, 50);
  doc.text("Total: ₱" + price, 20, 60);
  doc.save("receipt.pdf");
}
</script>

</body>
</html>
