<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Printing Sales Calculator</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
padding:15px;
}

.container{
max-width:600px;
margin:auto;
}

.card{
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,.1);
margin-bottom:15px;
}

h1{
text-align:center;
color:#0d6efd;
margin-bottom:15px;
}

label{
display:block;
margin-top:10px;
font-weight:bold;
}

select,input{
width:100%;
padding:12px;
margin-top:5px;
border:1px solid #ddd;
border-radius:8px;
}

.price-box{
margin-top:15px;
font-size:20px;
font-weight:bold;
color:#198754;
}

.total-box{
font-size:28px;
font-weight:bold;
color:#dc3545;
margin-top:10px;
}

button{
width:100%;
padding:14px;
background:#0d6efd;
color:white;
border:none;
border-radius:10px;
font-size:16px;
margin-top:15px;
cursor:pointer;
}

button:hover{
background:#084298;
}

.contact{
text-align:center;
line-height:1.8;
}

.sales-table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

.sales-table th,
.sales-table td{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

.sales-table th{
background:#0d6efd;
color:white;
}

@media(max-width:600px){
h1{
font-size:22px;
}
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>🖨 Printing Sales Calculator</h1>

<label>Product</label>
<select id="product"></select>

<label>Quantity</label>
<input type="number" id="qty" value="1">

<div class="price-box">
Price: ₱<span id="price">0</span>
</div>

<div class="total-box">
Total: ₱<span id="total">0</span>
</div>

<button onclick="saveSale()">
Save Sale
</button>

</div>

<div class="card">

<h3>Today's Sales</h3>

<table class="sales-table">

<thead>
<tr>
<th>Product</th>
<th>Qty</th>
<th>Total</th>
</tr>
</thead>

<tbody id="salesBody"></tbody>

</table>

<h2 style="margin-top:15px;color:green;">
Daily Total:
₱<span id="dailyTotal">0</span>
</h2>

</div>

<div class="card contact">

<h3>Contact Us</h3>

<p>ABC Printing Services</p>

<p>📞 Customer Care Hotline</p>

<p><b>0917-123-4567</b></p>

<p>✉ abcprinting@gmail.com</p>

<p>🌐 www.abcprinting.com</p>

</div>

</div>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwbYyFVCePRhJYsmJa8HmViNb2so8eMmjL4hDipNPgYhidoeHq0TRjeqSdwXuvizdpRsA/exec";

let products = [];
let dailyTotal = 0;

// Load Products
window.onload = loadProducts;

function loadProducts(){

fetch(SCRIPT_URL)
.then(response=>{

if(!response.ok){
throw new Error("Cannot connect to Google Apps Script");
}

return response.json();

})
.then(data=>{

products=data;

const select=document.getElementById("product");

select.innerHTML="";

products.forEach((item,index)=>{

let option=document.createElement("option");

option.value=index;
option.text=item.name;

select.appendChild(option);

});

updatePrice();

})
.catch(error=>{

console.error(error);

alert("Unable to load products.\n\n"+error);

});

}

// Calculate

document.getElementById("product").addEventListener("change",updatePrice);
document.getElementById("qty").addEventListener("input",updatePrice);

function updatePrice(){

if(products.length==0)return;

const product=products[
document.getElementById("product").value
];

const qty=parseFloat(document.getElementById("qty").value)||0;

const total=qty*Number(product.price);

document.getElementById("price").innerHTML=Number(product.price).toFixed(2);

document.getElementById("total").innerHTML=total.toFixed(2);

}

// Save Sale

function saveSale(){

if(products.length==0){

alert("Products not loaded.");

return;

}

const product=products[
document.getElementById("product").value
];

const qty=parseFloat(document.getElementById("qty").value)||0;

if(qty<=0){

alert("Enter valid quantity.");

return;

}

const total=qty*Number(product.price);

const formData=new URLSearchParams();

formData.append("product",product.name);
formData.append("qty",qty);
formData.append("price",product.price);
formData.append("total",total);

fetch(SCRIPT_URL,{
method:"POST",
body:formData
})
.then(response=>response.json())
.then(res=>{

if(res.success){

let row=`
<tr>
<td>${product.name}</td>
<td>${qty}</td>
<td>₱${total.toFixed(2)}</td>
</tr>
`;

document.getElementById("salesBody").insertAdjacentHTML("beforeend",row);

dailyTotal+=total;

document.getElementById("dailyTotal").innerHTML=dailyTotal.toFixed(2);

document.getElementById("qty").value=1;

updatePrice();

alert("Sale saved successfully.");

}else{

alert("Failed to save sale.");

}

})
.catch(error=>{

console.error(error);

alert("Error saving sale.\n\n"+error);

});

}

</script>

</body>
</html>
