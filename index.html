<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A&S Store Printing System</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

/* HEADER */
header {
  position: sticky;
  top: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
  display: flex;
  justify-content: space-between;
  padding: 15px;
}

/* HERO */
.hero {
  height: 70vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: linear-gradient(120deg,#0f172a,#1e3a8a);
}

/* BUTTON */
.btn {
  padding: 12px 16px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
.primary { background:#00aaff; color:white; }

/* PRICING CARDS */
.container { padding:20px; max-width:900px; margin:auto; }

.card {
  background: rgba(255,255,255,0.05);
  padding: 18px;
  border-radius: 12px;
  margin: 12px 0;
  border: 1px solid rgba(255,255,255,0.1);
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.04);
  box-shadow: 0 0 25px rgba(0,170,255,0.35);
}

/* CALCULATOR */
.calc {
  background: rgba(255,255,255,0.05);
  padding: 20px;
  border-radius: 12px;
}

select, input {
  width: 100%;
  padding: 10px;
  margin: 6px 0;
  border-radius: 6px;
}

/* FLOAT */
.floating {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #00aaff;
  padding: 14px;
  border-radius: 50px;
  cursor: pointer;
}
</style>
</head>

<body>

<header>
<div><b>A&S Store</b></div>
<nav>
<a href="#pricing">Pricing</a>
<a href="#calc">Calculator</a>
</nav>
</header>

<!-- HERO -->
<div class="hero">
<div>
<h1>Printing Services</h1>
<p>Xerox • Color • Rush Printing</p>
<button class="btn primary" onclick="openMessenger()">Message Us</button>
</div>
</div>

<!-- PRICING -->
<div class="container" id="pricing">

<div class="card">
<h2>📌 Pricing Updated</h2>

<b>XEROX / PRINT (B&W)</b><br>
SHORT/A4: ₱5 / ₱7 / ₱10<br>
LONG: ₱6 / ₱8 / ₱12<br>
+ ₱2 back-to-back<br><br>

<b>COLOR PRINT</b><br>
SHORT/A4: ₱7 / ₱15 / ₱20<br>
LONG: ₱8 / ₱18 / ₱22<br>
+ ₱3 back-to-back
</div>

</div>

<!-- CALCULATOR -->
<div class="container" id="calc">

<div class="calc card">
<h2>🧮 Auto Price Calculator</h2>

<select id="type">
<option value="bw">Black & White</option>
<option value="color">Color</option>
</select>

<select id="page">
<option value="short">Short / A4</option>
<option value="long">Long</option>
</select>

<select id="content">
<option value="text">Text Only</option>
<option value="mix">Text + Image</option>
<option value="full">Full Image</option>
</select>

<label>
<input type="checkbox" id="rush"> Rush Print (+₱5)
</label>

<label>
<input type="checkbox" id="back"> Back-to-back
</label>

<h2>Total: ₱<span id="total">0</span></h2>

<button class="btn primary" onclick="openMessenger()">Order via Messenger</button>
</div>

</div>

<div class="floating" onclick="openMessenger()">Chat</div>

<script>

const typeEl = document.getElementById("type");
const pageEl = document.getElementById("page");
const contentEl = document.getElementById("content");
const rushEl = document.getElementById("rush");
const backEl = document.getElementById("back");
const totalEl = document.getElementById("total");

function calc(){

let price = 0;
let type = typeEl.value;
let page = pageEl.value;
let content = contentEl.value;

if(type === "bw"){
  if(page === "short"){
    price = content==="text"?5:content==="mix"?7:10;
  } else {
    price = content==="text"?6:content==="mix"?8:12;
  }
  if(backEl.checked) price += 2;
}

if(type === "color"){
  if(page === "short"){
    price = content==="text"?7:content==="mix"?15:20;
  } else {
    price = content==="text"?8:content==="mix"?18:22;
  }
  if(backEl.checked) price += 3;
}

if(rushEl.checked) price += 5;

totalEl.innerText = price;

}

[typeEl,pageEl,contentEl,rushEl,backEl].forEach(e=>{
e.addEventListener("change",calc);
});

function openMessenger(){
window.open("https://www.messenger.com/t/asmamburao","_blank");
}

calc();

</script>

</body>
</html>
