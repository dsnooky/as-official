<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AS PRINTING POS</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0}
header{background:#0d6efd;color:#fff;padding:15px;text-align:center}
.container{max-width:1100px;margin:auto;padding:20px}
.card{background:#fff;padding:15px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
input,select,button{width:100%;padding:10px;margin:5px 0}
button{background:#0d6efd;color:white;border:none;cursor:pointer}
.total{font-size:28px;font-weight:bold;color:green}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:8px}
@media(max-width:768px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h2>AS PRINTING SALES CALCULATOR & POS</h2></header>

<div class="container">
<div class="grid">

<div class="card">
<h3>Sales Entry</h3>
<input id="customer" placeholder="Customer Name">
<select id="category"></select>
<select id="service"></select>
<input id="qty" type="number" value="1">
<input id="price" readonly>
<div class="total">₱ <span id="total">0.00</span></div>
<button onclick="saveSale()">Record Sale</button>
</div>

<div class="card">
<h3>Contact Us</h3>
<p><b>Store:</b> AS PRINTING</p>
<p><b>Customer Care Hotline:</b> 09620926818</p>
<p><b>Facebook:</b> https://www.facebook.com/ddsnooky</p>
</div>

</div>

<div class="card">
<h3>Today's Sales</h3>
<table>
<thead><tr><th>Date</th><th>Customer</th><th>Service</th><th>Total</th></tr></thead>
<tbody id="salesTable"></tbody>
</table>
</div>
</div>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbxl0GKuSS-ij1w1PGL6dbdjXkkFaV4s4Vqa1FBvn5TDjgzqfh5Qwgxgcg9i4Pxsdm8BuA/exec";
let priceData=[];

async function loadPrices(){
 const r=await fetch(SCRIPT_URL+"?action=prices");
 priceData=await r.json();

 let categories=[...new Set(priceData.map(x=>x.Category))];
 let cat=document.getElementById("category");
 cat.innerHTML=categories.map(c=>`<option>${c}</option>`).join("");
 loadServices();
}

function loadServices(){
 let cat=document.getElementById("category").value;
 let services=priceData.filter(x=>x.Category===cat);

 let s=document.getElementById("service");
 s.innerHTML=services.map(x=>`<option>${x.Service}</option>`).join("");
 calculate();
}

function calculate(){
 let srv=document.getElementById("service").value;
 let item=priceData.find(x=>x.Service===srv);
 if(!item)return;

 document.getElementById("price").value=item.Price;

 let qty=parseFloat(document.getElementById("qty").value||0);
 let total=qty*parseFloat(item.Price);

 document.getElementById("total").innerText=total.toFixed(2);
}

async function saveSale(){
 let payload={
 customer:document.getElementById("customer").value,
 category:document.getElementById("category").value,
 service:document.getElementById("service").value,
 qty:document.getElementById("qty").value,
 unitPrice:document.getElementById("price").value,
 total:document.getElementById("total").innerText
 };

 await fetch(SCRIPT_URL,{
 method:"POST",
 body:JSON.stringify(payload)
 });

 alert("Sale Recorded!");
}

document.addEventListener("change",e=>{
 if(["category","service","qty"].includes(e.target.id)){
   if(e.target.id==="category") loadServices();
   calculate();
 }
});

loadPrices();
</script>
</body>
</html>
