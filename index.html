<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A&S Store Order System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial;
    background: #f4f4f4;
    margin: 0;
    padding: 0;
}

.container {
    max-width: 500px;
    margin: 40px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

h2 { text-align: center; }

input, select, textarea {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
}

button {
    width: 100%;
    padding: 12px;
    background: #1877F2;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
}

button:hover {
    background: #0f5bd3;
}

#status {
    text-align: center;
    margin-top: 10px;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">
    <h2>A&S Store Order Form</h2>

    <input type="text" id="name" placeholder="Customer Name">

    <select id="service">
        <option>Black & White Print</option>
        <option>Colored Print</option>
        <option>Sticker Printing</option>
        <option>ID Picture</option>
        <option>Others</option>
    </select>

    <input type="number" id="qty" placeholder="Quantity">

    <textarea id="details" rows="4" placeholder="Details / Instructions"></textarea>

    <input type="file" id="fileUpload">

    <button onclick="sendOrder()">Send via Messenger</button>

    <div id="status"></div>
</div>

<script>
async function uploadFile(file) {
    let formData = new FormData();
    formData.append("image", file); // MUST be "image"

    let apiKey = "YOUR_IMGBB_API_KEY";

    let response = await fetch(`https://api.imgbb.com/1/upload?key=${apiKey}`, {
        method: "POST",
        body: formData
    });

    let data = await response.json();

    if (data.success) {
        return data.data.url;
    } else {
        console.log(data);
        throw new Error("Upload failed");
    }
}

async function sendOrder() {
    let name = document.getElementById("name").value;
    let service = document.getElementById("service").value;
    let qty = document.getElementById("qty").value;
    let details = document.getElementById("details").value;
    let file = document.getElementById("fileUpload").files[0];

    let status = document.getElementById("status");
    status.innerHTML = "Uploading file...";

    let fileLink = "";

    if (file) {
        try {
            fileLink = await uploadFile(file);
        } catch (err) {
            status.innerHTML = "Upload failed. Try again.";
            return;
        }
    }

    status.innerHTML = "Opening Messenger...";

    let message =
`Hello A&S Store!

New Order:

Name: ${name}
Service: ${service}
Quantity: ${qty}
Details: ${details}
File: ${fileLink ? fileLink : "No file uploaded"}`;

    let encoded = encodeURIComponent(message);

    let page = "asmamburao";

    window.open(`https://m.me/${page}?text=${encoded}`, "_blank");

    status.innerHTML = "Done!";
}
</script>

</body>
</html>
